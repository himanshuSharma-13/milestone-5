# Walkthrough note: this file records what the seed/model mean, who owns them,
# and which checks dbt should run when I execute dbt test.
version: 2

seeds:
  # In this demo, the CSV seed stands in for a Databricks-to-Snowflake transfer.
  - name: orders_silver
    description: "Approved demo copy of the clean Databricks orders. No personal details."
    config:
      meta:
        business_owner: "Sales owner (demo role; replace with a real person)"
        technical_owner: "Data engineer (demo role; replace with a real person)"
        data_steward: "Order operations (demo role; replace with a real person)"
        classification: "Internal"
    columns:
      # A valid order needs an ID, and two silver rows cannot share that ID.
      - name: order_id
        description: "Unique business order identifier."
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: order_amount
        description: "Amount in the order's currency; nonnegative values only."
        data_tests: [not_null]
      - name: currency
        # Keep the allowed currencies consistent with the Databricks notebook.
        data_tests:
          - accepted_values:
              arguments:
                values: ['INR', 'USD']
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['PLACED', 'SHIPPED', 'CANCELLED']

models:
  # This is the published aggregate, so its grain and owner are explicit.
  - name: daily_sales
    description: "Gross sales by date and currency for PLACED and SHIPPED orders."
    config:
      meta:
        business_owner: "Sales owner (demo role; replace with a real person)"
        classification: "Internal aggregate; no customer-level rows"
        lineage: "orders.csv -> Databricks bronze/silver -> dbt seed -> daily_sales"
    columns:
      - name: order_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null]
      - name: gross_sales
        data_tests: [not_null]
